name: Release

# Push a tag such as v0.1.0. The workflow tests, builds the universal zip (runs with `dotnet` on Windows, Linux and
# macOS) and creates a draft GitHub Release with the zip and its checksum. Publish the draft by hand after checking it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fast tests
        run: dotnet test -c Release --filter "Category!=E2E&Category!=E2EMatrix"

  release:
    name: Build and draft release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Publish
        run: >
          dotnet publish src/Umbraco.Engage.HealthCheck.Cli -c Release -p:UseAppHost=false
          -p:Version=$VERSION -o "dist/engage-healthcheck-$VERSION"
      - name: Check the version
        run: |
          actual="$(dotnet "dist/engage-healthcheck-$VERSION/engage-healthcheck.dll" --version)"
          echo "engage-healthcheck --version: $actual"
          [[ "${actual%%+*}" == "$VERSION" ]] || { echo "Expected $VERSION"; exit 1; }
      - name: Archive
        working-directory: dist
        run: |
          name="engage-healthcheck-$VERSION"
          rm -f "$name"/*.pdb
          cp ../README.md ../LICENSE ../THIRD-PARTY-NOTICES.md "$name/"
          zip -qr "$name.zip" "$name"
          rm -rf "$name"
          sha256sum "$name.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          --draft --generate-notes --title "Engage Health Check $GITHUB_REF_NAME"
          $([[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
